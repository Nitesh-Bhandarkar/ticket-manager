spring:
  application:
    name: ticket-manager

  datasource:
    url: jdbc:postgresql://localhost:5432/ticketmanager
    username: ${DB_USERNAME:ticketmanager}
    password: ${DB_PASSWORD:ticketmanager}

  jpa:
    hibernate:
      ddl-auto: validate
    properties:
      hibernate:
        dialect: org.hibernate.dialect.PostgreSQLDialect
    open-in-view: false

  flyway:
    enabled: true
    locations: classpath:db/migration

  ai:
    anthropic:
      api-key: ${ANTHROPIC_API_KEY}
      chat:
        options:
          model: claude-sonnet-4-6
          max-tokens: 1024
    vectorstore:
      pgvector:
        initialize-schema: true
        dimensions: 1536
        distance-type: COSINE_DISTANCE
        index-type: HNSW

jwt:
  secret: ${JWT_SECRET}
  expiration: 86400000

gmail:
  credentials-path: ${GMAIL_CREDENTIALS_PATH:credentials.json}
  target-inbox: ${GMAIL_TARGET_INBOX}

sla:
  high-priority-hours: 4
  medium-priority-hours: 24
  low-priority-hours: 72

scheduling:
  gmail-poll-interval-ms: ${GMAIL_POLL_INTERVAL:60000}

server:
  port: 8080
