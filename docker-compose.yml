services:
  postgres:
    image: pgvector/pgvector:pg16
    container_name: ticket-manager-db
    environment:
      POSTGRES_DB: ticketmanager
      POSTGRES_USER: ticketmanager
      POSTGRES_PASSWORD: ticketmanager
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ticketmanager"]
      interval: 10s
      timeout: 5s
      retries: 5

volumes:
  postgres_data:
